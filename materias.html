const translations={pt:{news:'NOTÍCIAS',all:'Todas as matérias',desc:'Encontre notícias e histórias da FJU JAPAN.',search:'Buscar por título ou texto',categories:'Todas as categorias',polos:'Todos os polos',months:'Todos os meses',newest:'Mais recentes primeiro',oldest:'Mais antigas primeiro',loading:'Carregando matérias…',count:n=>n+' matéria(s) encontrada(s)',read:'Ler matéria completa →',more:'Carregar mais',filters:'Filtros',hideFilters:'Ocultar filtros',clear:'Limpar filtros',copy:'Copiar link da pesquisa',copied:'Link copiado!',copyFail:'Não foi possível copiar. Copie o endereço do navegador.',emptyTitle:'Nenhuma matéria encontrada',emptyDesc:'Tente outra busca ou remova os filtros para ver mais matérias.',emptyAll:'Ainda não há matérias publicadas.',error:'Não foi possível carregar as matérias: '},ja:{news:'ニュース',all:'すべての記事',desc:'FJU JAPANのニュースや活動の記録をご覧ください。',search:'タイトルや本文を検索',categories:'すべてのカテゴリー',polos:'すべての教会',months:'すべての月',newest:'新しい順',oldest:'古い順',loading:'記事を読み込み中…',count:n=>n+' 件の記事',read:'記事を読む →',more:'さらに表示',filters:'絞り込み',hideFilters:'絞り込みを閉じる',clear:'条件をクリア',copy:'検索リンクをコピー',copied:'リンクをコピーしました！',copyFail:'コピーできませんでした。ブラウザーのURLをコピーしてください。',emptyTitle:'記事が見つかりませんでした',emptyDesc:'検索条件を変更するか、絞り込みを解除してください。',emptyAll:'公開された記事はまだありません。',error:'記事を読み込めませんでした: '},en:{news:'NEWS',all:'All articles',desc:'Discover news and stories from FJU JAPAN.',search:'Search titles or text',categories:'All categories',polos:'All locations',months:'All months',newest:'Newest first',oldest:'Oldest first',loading:'Loading articles…',count:n=>n+' article(s) found',read:'Read full article →',more:'Load more',filters:'Filters',hideFilters:'Hide filters',clear:'Clear filters',copy:'Copy search link',copied:'Link copied!',copyFail:'Could not copy. Please copy the browser address.',emptyTitle:'No articles found',emptyDesc:'Try another search or clear the filters to see more articles.',emptyAll:'There are no published articles yet.',error:'Unable to load articles: '}};const stored=(()=>{try{return localStorage.getItem('fju-connect-lang')}catch(e){return null}})();let currentLang=['pt','ja','en'].includes(new URLSearchParams(location.search).get('lang'))?new URLSearchParams(location.search).get('lang'):['pt','ja','en'].includes(stored)?stored:(['pt','ja','en'].includes(navigator.language.slice(0,2))?navigator.language.slice(0,2):'pt');const t=()=>translations[currentLang];function translate(){document.documentElement.lang=currentLang==='ja'?'ja':currentLang==='en'?'en':'pt-BR';document.title=t().all+' | FJU Connect JAPAN';document.querySelector('main>.meta').textContent='FJU CONNECT JAPAN / '+t().news;document.querySelector('h1').textContent=t().all;document.querySelector('.sub').textContent=t().desc;el('search').placeholder=t().search;el('search').setAttribute('aria-label',t().search);el('category').options[0].textContent=t().categories;el('polo').options[0].textContent=t().polos;el('month').options[0].textContent=t().months;el('sort').options[0].textContent=t().newest;el('sort').options[1].textContent=t().oldest;refreshMonthLabels();el('more').textContent=t().more;updateFilterControls();el('lang').value=currentLang;}const el=id=>document.getElementById(id),langs=['pt','ja','en'],pageSize=12;let articles=[],shown=pageSize,poloNames={};

const text=a=>langs.map(l=>[a['titulo_'+l],a['texto1_'+l],a['texto2_'+l],a['final_'+l]].filter(Boolean).join(' ')).join(' ').toLocaleLowerCase();
const label=s=>(s||'FJU').replaceAll('_',' ');function localizedDate(value){if(!value)return '';const day=String(value).slice(0,10);if(!/^\d{4}-\d{2}-\d{2}$/.test(day))return day;const [y,m,d]=day.split('-').map(Number);const date=new Date(Date.UTC(y,m-1,d,12));if(date.getUTCFullYear()!==y||date.getUTCMonth()!==m-1||date.getUTCDate()!==d)return day;return new Intl.DateTimeFormat(currentLang==='ja'?'ja-JP':currentLang==='en'?'en-US':'pt-BR',{day:'numeric',month:'short',year:'numeric',timeZone:'UTC'}).format(date);}function monthLabel(value){const [year,month]=value.split('-').map(Number);return new Intl.DateTimeFormat(currentLang==='ja'?'ja-JP':currentLang==='en'?'en-US':'pt-BR',{month:'long',year:'numeric'}).format(new Date(year,month-1,1));}function refreshMonthLabels(){for(const o of el('month').options)if(o.value)o.textContent=monthLabel(o.value);}
function syncFilterUrl(){const url=new URL(location.href);for(const [id,key] of [['search','q'],['category','categoria'],['polo','polo'],['month','mes'],['sort','ordem']]){const v=el(id).value.trim();if(v&&(id!=='sort'||v!=='newest'))url.searchParams.set(key,v);else url.searchParams.delete(key);}url.searchParams.set('lang',currentLang);history.replaceState(null,'',url.pathname+url.search+url.hash);}function restoreFilters(){const p=new URLSearchParams(location.search);for(const [id,key] of [['search','q'],['category','categoria'],['polo','polo'],['month','mes']]){const v=p.get(key)||'';if(id==='search')el(id).value=v;else if([...el(id).options].some(o=>o.value===v))el(id).value=v;}if(['search','category','polo','month'].some(id=>el(id).value)){el('filters').hidden=false;el('filter-toggle').setAttribute('aria-expanded','true');}}function updateFilterControls(){const n=['search','category','polo','month'].filter(id=>el(id).value.trim()).length;el('filter-toggle').textContent='☷ '+(el('filters').hidden?t().filters:t().hideFilters)+(n?' ('+n+')':'');el('clear-filters').hidden=!n;el('clear-filters').textContent=t().clear;el('empty-reset').textContent=t().clear;el('copy-search').textContent=t().copy;}function option(select,value,name){const o=document.createElement('option');o.value=value;o.textContent=name;select.appendChild(o);}

async function render(){const query=el('search').value.trim().toLocaleLowerCase(),cat=el('category').value,polo=el('polo').value,month=el('month').value;const filtered=articles.filter(a=>(!query||text(a).includes(query))&&(!cat||a.categoria===cat)&&(!polo||a.polo_id===polo)&&(!month||(a.data_materia||a.criado_em||'').slice(0,7)===month));if(el('sort').value==='oldest')filtered.reverse();el('grid').replaceChildren();updateFilterControls();syncFilterUrl();el('status').textContent=t().count(filtered.length);el('more').hidden=filtered.length<=shown;el('empty').hidden=filtered.length!==0;el('empty-title').textContent=t().emptyTitle;el('empty-desc').textContent=articles.length?t().emptyDesc:t().emptyAll;el('empty-reset').hidden=!articles.length;
for(const a of filtered.slice(0,shown)){const l=language(a),card=document.createElement('a');card.className='card';card.href='materia.html?id='+encodeURIComponent(a.id)+'&lang='+l;const img=document.createElement('img');img.className='cover';img.alt='Foto da matéria';img.loading='lazy';card.appendChild(img);signed(a.foto1).then(url=>{if(url)img.src=url;else img.style.display='none';});const body=document.createElement('div');body.className='body';const meta=document.createElement('div');meta.className='meta';meta.textContent=[label(a.categoria),localizedDate(a.data_materia||a.criado_em),poloNames[a.polo_id]||''].filter(Boolean).join(' • ');body.appendChild(meta);const h=document.createElement('h2');h.textContent=a['titulo_'+l];body.appendChild(h);const more=document.createElement('span');more.className='more';more.textContent=t().read;body.appendChild(more);card.appendChild(body);el('grid').appendChild(card);}}
translate();el('filter-toggle').onclick=()=>{const filters=el('filters');filters.hidden=!filters.hidden;el('filter-toggle').setAttribute('aria-expanded',String(!filters.hidden));updateFilterControls();};el('copy-search').onclick=async()=>{syncFilterUrl();try{await navigator.clipboard.writeText(location.href);el('copy-search').textContent=t().copied;}catch(e){el('copy-search').textContent=t().copyFail;}};el('empty-reset').onclick=()=>el('clear-filters').click();el('clear-filters').onclick=()=>{for(const id of ['search','category','polo','month'])el(id).value='';el('sort').value='newest';shown=pageSize;render();};el('lang').onchange=()=>{currentLang=el('lang').value;try{localStorage.setItem('fju-connect-lang',currentLang)}catch(e){}translate();render();};for(const id of ['search','category','polo','month','sort'])el(id).addEventListener(id==='search'?'input':'change',()=>{shown=pageSize;render();});el('more').onclick=()=>{shown+=pageSize;render();};
try{
const {data,error}=await db.from('fju_materias').select('id,polo_id,categoria,data_materia,criado_em,titulo_pt,titulo_ja,titulo_en,texto1_pt,texto1_ja,texto1_en,texto2_pt,texto2_ja,texto2_en,final_pt,final_ja,final_en,foto1').eq('status','publicada').order('criado_em',{ascending:false}).limit(1000);

[...new Set(articles.map(a=>(a.data_materia||a.criado_em||'').slice(0,7)).filter(x=>/^\d{4}-\d{2}$/.test(x)))].sort().reverse().forEach(m=>option(el('month'),m,monthLabel(m)));[...new Set(articles.map(a=>a.categoria).filter(Boolean))].sort().forEach(c=>option(el('category'),c,label(c)));
