<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101019"><title>Cadastro concluído · FJU Japan</title><style>*{box-sizing:border-box}body{margin:0;background:#101019;color:#f8f6fc;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:620px;margin:auto;padding:24px 16px}.card{margin-top:24px;background:#1b1924;border:1px solid #40364e;border-radius:18px;padding:22px}.brand{font-size:11px;letter-spacing:1.5px;color:#c5a2ff;font-weight:800}.success{font-size:46px}.btn{display:block;text-align:center;text-decoration:none;border:0;border-radius:12px;padding:15px;background:linear-gradient(100deg,#a67aff,#bf88f2);color:#21152f;font-weight:850;margin:12px 0}.link{overflow-wrap:anywhere;color:#d7baff}.muted{color:#aaa6b8;line-height:1.5}</style></head><body><main class="wrap"><div class="brand">FJU JAPAN · CAMPEONATOS</div><section class="card"><div class="success">✅</div><h1>Cadastro realizado!</h1><p id="message">Seu time e o capitão foram cadastrados.</p><p class="muted">Use o link abaixo para acessar o painel do capitão e enviar o convite para os jogadores.</p><a id="captain" class="link"></a><button id="copy" class="btn">Copiar link do capitão</button><a href="cadastro-time-independente.html" class="btn">Voltar aos campeonatos</a></section></main><script>const p=new URLSearchParams(location.search),token=p.get('capitao'),link='https://fju-connect.vercel.app/campeonatos/index.html?capitao='+encodeURIComponent(token||'');const a=document.querySelector('#captain');a.href=link;a.textContent=link;if(p.get('pendente')==='1')document.querySelector('#message').textContent='O time foi criado, mas o cadastro do capitão não terminou. Acesse o painel pelo link abaixo para continuar.';document.querySelector('#copy').onclick=async()=>{try{await navigator.clipboard.writeText(link);document.querySelector('#copy').textContent='Link copiado!'}catch{alert('Selecione e copie o link acima.')}};</script></body></html>
