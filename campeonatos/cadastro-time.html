<!doctype html>
<html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cadastro de time | FJU Japan</title><meta name="theme-color" content="#11111b">
<style>
:root{color-scheme:dark;--bg:#101019;--panel:#1a1925;--line:#39334b;--text:#f7f5fc;--muted:#aaa5ba;--accent:#b18aff}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -8%,#2b1d42 0,transparent 42%),var(--bg);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.wrap{width:min(100% - 32px,620px);margin:0 auto;padding:clamp(28px,8vh,72px) 0 48px}.header{margin-bottom:28px}.eyebrow{display:inline-flex;align-items:center;gap:8px;color:#c7a8ff;font-size:11px;font-weight:800;letter-spacing:1.7px;text-transform:uppercase}.eyebrow:before{content:"";width:22px;height:2px;border-radius:2px;background:var(--accent)}
h1{font-size:clamp(28px,8vw,38px);line-height:1.12;letter-spacing:-1.1px;margin:12px 0 10px;font-weight:850}.subtitle{margin:0;color:var(--muted);font-size:15px;line-height:1.55}
.list-head{display:flex;align-items:center;justify-content:space-between;margin:25px 2px 12px;gap:10px}.list-head h2{font-size:15px;margin:0;font-weight:750}.count{font-size:11px;color:#c9b4e8;background:#2a2138;border:1px solid #4b3b62;padding:5px 9px;border-radius:999px}
.events{display:grid;gap:12px}.event-card{background:linear-gradient(145deg,#211d30,#191823);border:1px solid #40364f;border-radius:17px;padding:17px;box-shadow:0 12px 28px #0002}.event-top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}.sport{display:inline-flex;padding:5px 9px;border-radius:999px;background:#332442;color:#d9baff;font-size:11px;font-weight:800;letter-spacing:.3px}.open-badge{display:inline-flex;align-items:center;gap:5px;color:#b9f2d5;font-size:11px;font-weight:700}.open-badge:before{content:"";width:6px;height:6px;border-radius:50%;background:#5cd69b}
.event-title{font-size:18px;font-weight:800;line-height:1.32;letter-spacing:-.35px;margin:0 0 13px;overflow-wrap:anywhere}.meta{display:grid;gap:7px;color:#c2bbd0;font-size:13px;margin-bottom:15px}.meta-row{display:flex;align-items:flex-start;gap:9px}.meta-icon{width:17px;flex:0 0 17px;color:#b89aff;text-align:center}.meta-text{min-width:0}
.cta{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;min-height:50px;border-radius:12px;background:linear-gradient(100deg,#a77bff,#bd82ef);color:#20142e;text-decoration:none;font-size:14px;font-weight:850;letter-spacing:.1px;box-shadow:0 5px 18px #a678ff22;transition:transform .15s,filter .15s}.cta:active{transform:scale(.985);filter:brightness(.96)}.cta span{font-size:18px;line-height:1}
.info{margin-top:17px;padding:13px 14px;border:1px solid #393247;border-radius:12px;background:#171621;color:#aaa4b8;font-size:12px;line-height:1.55}.info strong{color:#d6c9e8}
.state{padding:18px;border:1px solid var(--line);border-radius:14px;background:var(--panel);color:var(--muted);font-size:14px;text-align:center}.state.error{border-color:#65404d;color:#ffc7d1}.loading{display:inline-flex;align-items:center;gap:9px}.spinner{width:15px;height:15px;border:2px solid #665477;border-top-color:#c49aff;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
@media(min-width:560px){.event-card{padding:20px}.event-title{font-size:20px}.wrap{padding-top:60px}}
</style></head>
<body><main class="wrap"><header class="header"><div class="eyebrow">FJU Japan · Campeonatos</div><h1>Cadastro de time</h1><p class="subtitle">Escolha o campeonato e comece o cadastro do capitão. Depois, compartilhe o link com sua equipe.</p></header>
<div class="list-head"><h2>Inscrições abertas</h2><span class="count" id="count">Carregando</span></div><div id="events" class="events"><div class="state"><span class="loading"><span class="spinner"></span>Buscando campeonatos…</span></div></div>
<div class="info"><strong>Como funciona:</strong> o capitão inicia o cadastro do time e recebe um link exclusivo para convidar os jogadores.</div></main>
<script type="module">
import{createClient}from'https://esm.sh/@supabase/supabase-js@2';const db=createClient('https://hmacroktklgwkofxsygv.supabase.co','sb_publishable_mdkfafhpqtthwzU8Hf7u9A_rErx3MFJ');const host=document.querySelector('#events'),count=document.querySelector('#count');const date=v=>{try{return new Date(v+'T12:00:00').toLocaleDateString('ja-JP')}catch{return v||''}};
async function load(){let{data,error}=await db.from('fju_campeonatos').select('id,titulo,modalidade,data_evento,hora_inicio,local_evento,inscricoes_abertas,prazo_inscricao,publicado').eq('publicado',true).order('data_evento');if(error){const f=await db.rpc('fju_campeonato_eventos_publicos');data=f.data;error=f.error}if(error||!Array.isArray(data)){count.textContent='—';host.innerHTML='<div class="state error">Não foi possível carregar os campeonatos. Atualize a página e tente novamente.</div>';return}
const today=new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Tokyo'});const open=data.filter(e=>e.inscricoes_abertas===true&&(!e.prazo_inscricao||e.prazo_inscricao>=today));count.textContent=open.length+' '+(open.length===1?'campeonato':'campeonatos');if(!open.length){host.innerHTML='<div class="state">Nenhuma inscrição aberta no momento.</div>';return}host.replaceChildren();
for(const e of open){const c=document.createElement('article');c.className='event-card';c.innerHTML='<div class="event-top"><span class="sport"></span><span class="open-badge">Inscrições abertas</span></div><h3 class="event-title"></h3><div class="meta"><div class="meta-row"><span class="meta-icon">▦</span><span class="meta-text date"></span></div><div class="meta-row location-row"><span class="meta-icon">⌖</span><span class="meta-text location"></span></div></div><a class="cta" href="#"><span>Cadastrar meu time</span><span aria-hidden="true">→</span></a>';c.querySelector('.sport').textContent=e.modalidade||'Campeonato';c.querySelector('.event-title').textContent=e.titulo||'Campeonato FJU';c.querySelector('.date').textContent=[date(e.data_evento),e.hora_inicio||''].filter(Boolean).join(' · ');const location=c.querySelector('.location');location.textContent=e.local_evento||'';if(!e.local_evento)c.querySelector('.location-row').remove();c.querySelector('.cta').href='/campeonatos/?criar='+encodeURIComponent(e.id);host.append(c)}}
load().catch(e=>{count.textContent='—';host.innerHTML='<div class="state error">Erro ao carregar: '+String(e.message||e)+'</div>'});
</script></body></html>
