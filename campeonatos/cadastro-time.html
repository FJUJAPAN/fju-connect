<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cadastro de time FJU</title><meta name="theme-color" content="#10101b"><style>*{box-sizing:border-box}body{margin:0;background:#10101b;color:#f6f5ff;font-family:system-ui;padding:20px}.wrap{max-width:680px;margin:auto}.card{background:#1d1c2e;border:1px solid #37354f;border-radius:18px;padding:18px;margin:12px 0}.btn{display:block;text-align:center;background:#7c4dff;color:white;text-decoration:none;font-weight:800;padding:15px;border-radius:12px;margin-top:14px}.muted{color:#b9b7ce}.event{font-weight:750;font-size:18px}.error{color:#ffb6bd}</style></head><body><main class="wrap"><h2>🏆 Cadastro de time — FJU Japan</h2><p class="muted">Página independente para iniciar o cadastro do capitão. Escolha o campeonato.</p><div id="events">Carregando campeonatos…</div></main><script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2';const db=createClient('https://hmacroktklgwkofxsygv.supabase.co','sb_publishable_mdkfafhpqtthwzU8Hf7u9A_rErx3MFJ');const host=document.querySelector('#events');const date=v=>{try{return new Date(v+'T12:00:00').toLocaleDateString('ja-JP')}catch{return v||''}};async function load(){let{data,error}=await db.from('fju_campeonatos').select('id,titulo,modalidade,data_evento,hora_inicio,local_evento,inscricoes_abertas,prazo_inscricao,publicado').eq('publicado',true).order('data_evento');if(error){const f=await db.rpc('fju_campeonato_eventos_publicos');data=f.data;error=f.error}if(error||!Array.isArray(data)){host.innerHTML='<div class="card error">Não foi possível carregar. Tente novamente.</div>';return}const today=new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Tokyo'});const open=data.filter(e=>e.inscricoes_abertas===true&&(!e.prazo_inscricao||e.prazo_inscricao>=today));if(!open.length){host.innerHTML='<div class="card">Nenhuma inscrição aberta.</div>';return}host.replaceChildren();for(const e of open){const c=document.createElement('section');c.className='card';c.innerHTML='<div class="event"></div><div class="muted"></div><a class="btn">INICIAR CADASTRO DO CAPITÃO</a>';c.querySelector('.event').textContent=e.titulo+' · '+e.modalidade;c.querySelector('.muted').textContent=[date(e.data_evento),e.hora_inicio||'',e.local_evento||''].filter(Boolean).join(' · ');c.querySelector('a').href='/campeonatos/?criar='+encodeURIComponent(e.id);host.append(c)}}load().catch(e=>{host.innerHTML='<div class="card error">Erro: '+String(e.message||e)+'</div>'});</script></body></html>
