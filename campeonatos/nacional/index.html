<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0c1423"><title>Painel Nacional | Campeonatos FJU</title><style>
*{box-sizing:border-box}body{margin:0;background:#0b1220;color:#f3f6ff;font:15px/1.5 system-ui,-apple-system,sans-serif}main{max-width:1100px;margin:auto;padding:20px 14px 60px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.brand{font-weight:900;letter-spacing:.08em}.muted{color:#a9b6ca}.card{background:#131e31;border:1px solid #26364d;border-radius:16px;padding:16px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:#17243a;border:1px solid #283c59;border-radius:12px;padding:12px}.stat b{font-size:26px;display:block}.btn,button{background:#273852;color:#fff;border:1px solid #405574;border-radius:9px;padding:10px 12px;font:inherit;cursor:pointer}.btn.primary{background:#895be5;border-color:#a47cf1}.btn.danger{background:#612c3c;border-color:#8e4b5d}.btn.small{padding:6px 9px;font-size:13px}.actions{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.input{width:100%;background:#0b1423;color:white;border:1px solid #354963;border-radius:9px;padding:12px;font:inherit;margin:8px 0}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.tabs button.active{background:#8758e4}.event h2{margin:0}.team,.player{padding:12px;border:1px solid #2a3a50;border-radius:11px;margin:8px 0;background:#0f1a2b}.player{margin-left:12px}.status{display:inline-block;border-radius:20px;padding:2px 9px;background:#263852;font-size:12px}.status.aprovado{background:#164c3a}.status.pendente{background:#654c1c}.status.rejeitado{background:#5b2d3a}.login{max-width:430px;margin:40px auto}.hidden{display:none!important}table{width:100%;border-collapse:collapse}td,th{text-align:left;border-bottom:1px solid #2a3b52;padding:9px;vertical-align:top}.scroll{overflow:auto}@media(max-width:650px){.grid{grid-template-columns:repeat(2,1fr)}}
</style></head><body><main>
<div class="top"><div><div class="brand">FJU CONNECT · PAINEL NACIONAL</div><div class="muted">Controle administrativo dos campeonatos</div></div><div id="userbar"></div></div>
<section id="login" class="card login"><h2>Acesso Nacional</h2><p class="muted">Entre com sua conta administrativa ativa.</p><form id="loginForm"><input class="input" type="email" name="email" placeholder="E-mail" required><input class="input" type="password" name="password" placeholder="Senha" required><button class="btn primary" style="width:100%">Entrar</button></form><p id="loginError" class="muted"></p></section>
<section id="panel" class="hidden"><div class="grid" id="stats"></div><div class="tabs"><button data-tab="records" class="active">Campeonatos / Times / Atletas</button><button data-tab="audit">Histórico de alterações</button></div>
<section id="records"><input id="search" class="input" placeholder="Buscar campeonato, polo, time, capitão, atleta…"><div id="list"></div></section><section id="audit" class="hidden"><div id="auditList"></div></section>
</section>
</main>
<script type="module">
import{createClient}from'https://esm.sh/@supabase/supabase-js@2';
const db=createClient('https://hmacroktklgwkofxsygv.supabase.co','sb_publishable_mdkfafhpqtthwzU8Hf7u9A_rErx3MFJ');
const $=s=>document.querySelector(s);let evs=[],teams=[],players=[],polos=[],tab='records';
const status=s=>'<span class="status '+s+'">'+s+'</span>';
const date=s=>s?new Date(s+'T12:00:00').toLocaleDateString('ja-JP'):'—';
function show(){ $('#login').classList.add('hidden');$('#panel').classList.remove('hidden');$('#userbar').innerHTML='<button id="logout">Sair</button>';$('#logout').onclick=async()=>{await db.auth.signOut();location.reload()}}
async function auth(){const{data:{session}}=await db.auth.getSession();if(!session){$('#login').classList.remove('hidden');return}const{data:p,error}=await db.from('fju_perfis').select('papel,ativo').eq('usuario_id',session.user.id).maybeSingle();if(error||p?.papel!=='nacional'||!p.ativo){await db.auth.signOut();$('#loginError').textContent='Conta sem perfil Nacional ativo.';return}show();await load()}
$('#loginForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.currentTarget);const{error}=await db.auth.signInWithPassword({email:f.get('email'),password:f.get('password')});if(error)$('#loginError').textContent=error.message;else auth()};
async function load(){const [a,b,c,d]=await Promise.all([db.from('fju_campeonatos').select('*').order('data_evento'),db.from('fju_campeonatos_times').select('*').order('criado_em',{ascending:false}),db.from('fju_campeonatos_jogadores').select('*').order('criado_em',{ascending:false}),db.rpc('fju_campeonato_listar_polos')]);for(const x of[a,b,c,d])if(x.error){$('#list').textContent='Erro carregando dados: '+x.error.message;return}evs=a.data||[];teams=b.data||[];players=c.data||[];polos=d.data||[];$('#stats').innerHTML='<div class=stat><b>'+evs.length+'</b>Campeonatos</div><div class=stat><b>'+teams.filter(t=>t.status==='pendente').length+'</b>Times pendentes</div><div class=stat><b>'+players.filter(p=>p.status==='pendente').length+'</b>Atletas pendentes</div><div class=stat><b>'+teams.length+'</b>Times no total</div>';render()}
function render(){const q=$('#search').value.toLowerCase();const out=$('#list');out.replaceChildren();for(const e of evs){const et=teams.filter(t=>t.campeonato_id===e.id);if(q&&!([e.titulo,e.modalidade,e.local_evento].join(' ').toLowerCase().includes(q))&&!et.some(t=>[t.nome_time,t.capitao_nome,polos.find(p=>p.id===t.polo_id)?.nome||''].join(' ').toLowerCase().includes(q))&&!et.some(t=>players.filter(p=>p.time_id===t.id).some(p=>(p.nome||'').toLowerCase().includes(q))))continue;const card=document.createElement('article');card.className='card event';card.innerHTML='<h2>'+esc(e.titulo)+' · '+esc(e.modalidade)+'</h2><p class=muted>'+date(e.data_evento)+' · '+esc(e.local_evento||'')+' · '+(e.inscricoes_abertas?'Inscrições abertas':'Inscrições fechadas')+' · '+(e.publicado?'Publicado':'Não publicado')+'</p><div class=actions><button class=small data-edit-event>Editar campeonato</button><button class=small data-toggle>Alternar publicado/inscrição</button><button class="small danger" data-del-event>Excluir campeonato</button></div>';card.querySelector('[data-edit-event]').onclick=()=>editEvent(e);card.querySelector('[data-toggle]').onclick=async()=>{const{error}=await db.rpc('fju_campeonato_atualizar',{p_id:e.id,p_publicado:!e.publicado,p_inscricoes_abertas:!e.inscricoes_abertas});if(error)alert(error.message);else load()};card.querySelector('[data-del-event]').onclick=()=>del('event',e.id,'Excluir este campeonato e todos os times/atletas vinculados?');for(const t of et){const box=document.createElement('div');box.className='team';const polo=polos.find(p=>p.id===t.polo_id)?.nome||'?';box.innerHTML='<b>'+esc(t.nome_time)+'</b> · '+esc(polo)+' · capitão: '+esc(t.capitao_nome)+' '+status(t.status)+'<div class=actions><button class=small data-edit>Editar time</button><button class=small data-status>Aprovar/rejeitar/status</button><button class="small danger" data-del>Excluir time</button></div>';box.querySelector('[data-edit]').onclick=()=>editTeam(t);box.querySelector('[data-status]').onclick=async()=>{let s=prompt('Status: pendente / aprovado / rejeitado',t.status);if(!s)return;const{error}=await db.rpc('fju_campeonato_admin_editar_time',{p_id:t.id,p_nome:t.nome_time,p_polo_id:t.polo_id,p_capitao:t.capitao_nome,p_status:s});if(error)alert(error.message);else load()};box.querySelector('[data-del]').onclick=()=>del('team',t.id,'Excluir time e os atletas vinculados?');for(const p of players.filter(p=>p.time_id===t.id)){const row=document.createElement('div');row.className='player';row.innerHTML=esc(p.nome||'(convite sem nome)')+' · '+status(p.status)+'<div class=actions><button class=small data-edit>Editar ficha</button><button class=small data-status>Status</button><button class="small danger" data-del>Excluir atleta</button></div>';row.querySelector('[data-edit]').onclick=()=>editPlayer(p);row.querySelector('[data-status]').onclick=async()=>{let s=prompt('Status: convite / pendente / aprovado / rejeitado',p.status);if(!s)return;const{error}=await db.rpc('fju_campeonato_admin_editar_jogador',{p_id:p.id,p_nome:p.nome||'Convite',p_nascimento:p.nascimento||'2000-01-01',p_cidade:p.cidade_bairro||'N/A',p_fju_numero:p.fju_numero,p_status:s});if(error)alert(error.message);else load()};row.querySelector('[data-del]').onclick=()=>del('player',p.id,'Excluir atleta?');box.append(row)}card.append(box)}out.append(card)}}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function editTeam(t){const nome=prompt('Nome do time',t.nome_time);if(nome===null)return;const cap=prompt('Capitão',t.capitao_nome);if(cap===null)return;const polo=prompt('Polo UUID (atual: '+t.polo_id+')',t.polo_id);if(polo===null)return;const st=prompt('Status',t.status);if(st===null)return;const{error}=await db.rpc('fju_campeonato_admin_editar_time',{p_id:t.id,p_nome:nome,p_polo_id:polo,p_capitao:cap,p_status:st});if(error)alert(error.message);else load()}
async function editPlayer(p){const nome=prompt('Nome',p.nome||'');if(nome===null)return;const nasc=prompt('Nascimento AAAA-MM-DD',p.nascimento||'2000-01-01');if(nasc===null)return;const city=prompt('Cidade/bairro',p.cidade_bairro||'');if(city===null)return;const fju=prompt('FJU ID (vazio = sem)',p.fju_numero||'');if(fju===null)return;const st=prompt('Status',p.status);if(st===null)return;const{error}=await db.rpc('fju_campeonato_admin_editar_jogador',{p_id:p.id,p_nome:nome,p_nascimento:nasc,p_cidade:city,p_fju_numero:fju?Number(fju):null,p_status:st});if(error)alert(error.message);else load()}
async function editEvent(e){const title=prompt('Título',e.titulo);if(title===null)return;const sport=prompt('Modalidade',e.modalidade);if(sport===null)return;const dt=prompt('Data YYYY-MM-DD',e.data_evento);if(dt===null)return;const start=prompt('Hora início HH:MM',e.hora_inicio||'');if(start===null)return;const end=prompt('Hora fim HH:MM (vazio = sem)',e.hora_fim||'');if(end===null)return;const venue=prompt('Local',e.local_evento);if(venue===null)return;const polo=prompt('Polo sede UUID',e.polo_sede_id);if(polo===null)return;const desc=prompt('Descrição',e.descricao||'');if(desc===null)return;const deadline=prompt('Prazo inscrição AAAA-MM-DD (vazio = sem)',e.prazo_inscricao||'');if(deadline===null)return;const maxp=prompt('Max atletas/time',e.max_jogadores_time);if(maxp===null)return;const maxt=prompt('Max times (vazio=sem)',e.max_times||'');if(maxt===null)return;const pub=confirm('Publicado? (OK sim / Cancelar não)');const open=confirm('Inscrições abertas? (OK sim / Cancelar não)');const{error}=await db.rpc('fju_campeonato_admin_editar_evento',{p_id:e.id,p_titulo:title,p_modalidade:sport,p_data:dt,p_inicio:start||null,p_fim:end||null,p_local:venue,p_polo:polo,p_descricao:desc,p_prazo:deadline||null,p_max_jogadores:Number(maxp),p_max_times:maxt?Number(maxt):null,p_publicado:pub,p_aberto:open});if(error)alert(error.message);else load()}
async function del(type,id,message){if(!confirm(message+' O registro será arquivado antes da exclusão.'))return;const reason=prompt('Motivo da exclusão (opcional)')||null;const{error}=await db.rpc('fju_campeonato_admin_excluir',{p_tipo:type,p_id:id,p_motivo:reason});if(error)alert(error.message);else{alert('Excluído e arquivado.');load()}}
async function audit(){const{data,error}=await db.rpc('fju_campeonato_admin_audit_list',{p_limit:200});const out=$('#auditList');out.replaceChildren();if(error){out.textContent=error.message;return}const table=document.createElement('table');table.innerHTML='<thead><tr><th>Data</th><th>Ação</th><th>Tipo</th><th>ID</th><th>Dados</th></tr></thead>';const tb=document.createElement('tbody');for(const r of data||[]){const tr=document.createElement('tr');tr.innerHTML='<td>'+new Date(r.created_at).toLocaleString('ja-JP')+'</td><td>'+esc(r.action)+'</td><td>'+esc(r.entity_type)+'</td><td>'+esc(r.entity_id)+'</td><td><details><summary>Ver snapshot</summary><pre>'+esc(JSON.stringify({before:r.before_data,after:r.after_data},null,2))+'</pre></details></td>';tb.append(tr)}table.append(tb);out.append(table)}
$('.tabs').onclick=e=>{const b=e.target.closest('[data-tab]');if(!b)return;tab=b.dataset.tab;document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('active',x===b));$('#records').classList.toggle('hidden',tab!=='records');$('#audit').classList.toggle('hidden',tab!=='audit');if(tab==='audit')audit()};$('#search').oninput=render;auth();
</script></body></html>
