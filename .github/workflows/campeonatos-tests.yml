name: Championships pilot tests
on:
  pull_request:
    paths:
      - 'campeonatos/**'
      - 'supabase/20261119_campeonatos_piloto.sql'
      - 'tests/campeonatos-piloto.test.mjs'
      - '.github/workflows/campeonatos-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/campeonatos-piloto.test.mjs
