name: Atualizar previas Facebook
on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'
permissions:
  contents: write
jobs:
  previews:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Gerar paginas das materias
        env:
          SUPABASE_ANON_KEY: sb_publishable_mdkfafhpqtthwzU8Hf7u9A_rErx3MFJ
        run: python scripts/generate_article_previews.py
      - name: Commit das previas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add share/
          if ! git diff --cached --quiet; then
            git commit -m "Atualizar previas Facebook"
            git push
          fi
