name: Atualizar previas Facebook
on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'
permissions:
  contents: write
  pull-requests: write
jobs:
  previews:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Gerar paginas das materias
        env:
          SUPABASE_ANON_KEY: sb_publishable_mdkfafhpqtthwzU8Hf7u9A_rErx3MFJ
        run: python scripts/generate_article_previews.py
      - name: Abrir pull request com as previas
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: bot/atualizar-previas-facebook
          base: main
          delete-branch: true
          commit-message: "Atualizar previas Facebook"
          title: "Atualizar previas Facebook das materias"
          body: "Atualizacao automatica das paginas e fotos de compartilhamento de materias publicadas. Revisar e aprovar para publicar no GitHub Pages."
          add-paths: share/

