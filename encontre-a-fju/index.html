function action(title,url,cls){let a=el('a','btn '+(cls||''),title);a.href=url;a.target='_blank';a.rel='noopener noreferrer';return a}
function detail(p){const d=$('detail');d.replaceChildren();const close=el('button','close','×');close.onclick=()=>d.close();const content=el('div');content.append(el('h2','',name(p)),el('p','',p.address||p.city),el('h3','',tr('projects')),el('p','',p.projects?.length?p.projects.join(' · '):tr('noProjects')));const links=el('div','actions');links.append(action(tr('route'),mapUrl(p)),action(tr('whatsapp'),whatsapp(p),'btn-blue'));d.append(close,content,links);d.showModal()}
function render(){const list=$('results');list.replaceChildren();const entries=ordered();$('count').textContent=polos.length+' '+tr('count');if(!entries.length){list.append(el('div','empty',tr('empty')));return}entries.forEach((p,i)=>{const first=!!userPosition&&i===0,highlight=first?' featured':'';let card=el('article','card'+highlight),heading=el('div','cardhead'),info=el('div');info.append(el('h2','',name(p)),el('p','sub',p.city+', '+p.prefecture),el('p','address',p.address||''));heading.append(el('span','rank',String(i+1).padStart(2,'0')),info);card.append(heading);const d=el('div','distance',p.distance===null?tr('noDistance'):tr('approx')+' '+p.distance.toLocaleString(lang,{maximumFractionDigits:1})+' km');if(first)d.append(el('span','tag',p.id==='hamamatsu'&&prioritize()?tr('featured'):tr('nearest')));card.append(d);const controls=el('div','actions'),details=el('button','btn',tr('view'));details.onclick=()=>detail(p);controls.append(details,action(tr('route'),mapUrl(p)),action(tr('whatsapp'),whatsapp(p),'btn-blue'));card.append(controls);list.append(card)})}
function choices(){const sel=$('reference'),was=sel.value||referenceId;sel.replaceChildren();const ph=el('option','',tr('reference'));ph.value='';sel.append(ph);polos.filter(p=>p.lat!=null&&p.lng!=null).sort((a,b)=>name(a).localeCompare(name(b),lang)).forEach(p=>{const option=el('option','',name(p)+' — '+p.city);option.value=p.id;sel.append(option)});sel.value=polos.some(p=>p.id===was)?was:''}
function setLanguage(next){lang=TR[next]?next:'ja';document.documentElement.lang=lang;try{localStorage.setItem(LANG_KEY,lang)}catch{}$('lang').value=lang;$('heroTitle').innerHTML=tr('title');document.querySelectorAll('[data-t]').forEach(n=>n.textContent=tr(n.dataset.t));$('search').placeholder=tr('search');choices();render();if(mode==='gps')$('geoStatus').textContent=tr('geoSuccess');if(mode==='reference')$('geoStatus').textContent=tr('refStatus')}
$('lang').onchange=e=>setLanguage(e.target.value);$('search').oninput=e=>{searchTerm=e.target.value.trim();render()};
$('reference').onchange=e=>{referenceId=e.target.value;let p=polos.find(p=>p.id===referenceId);userPosition=p?{lat:p.lat,lng:p.lng}:null;mode=p?'reference':'';$('geoStatus').textContent=p?tr('refStatus'):'';$('clear').hidden=!p;render()};
$('clear').onclick=()=>{userPosition=null;mode='';referenceId='';$('reference').value='';$('clear').hidden=true;$('geoStatus').textContent='';render()};
$('gps').onclick=()=>{if(!navigator.geolocation||!window.isSecureContext){$('geoStatus').textContent=tr('geoError');return}$('gps').disabled=true;$('geoStatus').textContent=tr('searching');navigator.geolocation.getCurrentPosition(({coords})=>{userPosition={lat:coords.latitude,lng:coords.longitude};mode='gps';referenceId='';$('reference').value='';$('clear').hidden=false;$('gps').disabled=false;$('geoStatus').textContent=tr('geoSuccess');render()},()=>{$('gps').disabled=false;$('geoStatus').textContent=tr('geoError')},{enableHighAccuracy:false,timeout:12000,maximumAge:120000})};
$('detail').onclick=e=>{if(e.target===$('detail'))e.target.close()};
$('year').textContent=new Date().getFullYear();setLanguage(lang);
</script></body></html>
