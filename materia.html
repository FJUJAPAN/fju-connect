<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0e2b52"><title>Matéria | FJU Connect JAPAN</title><meta name="description" content="Notícias e histórias da FJU JAPAN"><style>
*{box-sizing:border-box}body{margin:0;background:#f4f6fa;color:#173354;font:16px/1.75 system-ui,'Noto Sans JP',sans-serif}header{background:#0d2c52;color:white;padding:16px 22px}header>div{max-width:900px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:16px}a{color:inherit}header a{text-decoration:none;font-weight:800}.brand{font-size:19px;letter-spacing:1px}.brand span{color:#ff4771}main{max-width:900px;margin:28px auto 70px;padding:0 16px}.article{background:white;border-radius:16px;overflow:hidden;box-shadow:0 12px 38px #10234213}.cover{display:block;width:100%;max-height:460px;object-fit:cover}.content{padding:clamp(20px,5vw,46px)}.meta{color:#d62952;font-weight:800;letter-spacing:1px;text-transform:uppercase;font-size:12px}.title{font-size:clamp(29px,5vw,48px);line-height:1.14;color:#0d2d55;margin:15px 0 25px}.bodytext{white-space:pre-wrap;font-size:17px;line-height:1.95;margin:24px 0}.photo{display:block;width:100%;height:auto;max-height:560px;object-fit:contain;border-radius:12px;margin:25px auto}select{padding:11px 14px;border:1px solid #aebbd0;border-radius:9px;background:white;color:#0d2d55;font:inherit;max-width:100%}.loading{padding:45px;text-align:center}.back{display:inline-block;margin:0 0 16px;text-decoration:none;color:#0d2d55;font-weight:800}.tag{font-size:12px;color:#586b80;margin:8px 0 20px}.error{color:#ad2040}.photo-caption{color:#65748b;font-size:13px}
.share{margin:30px 0 6px;padding-top:20px;border-top:1px solid #e2e8f0}.share-title{font-weight:800;color:#0d2d55;margin:0 0 12px}.share-buttons{display:flex;flex-wrap:wrap;gap:10px}.share-buttons a,.share-buttons button{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 15px;border-radius:9px;border:0;color:white;text-decoration:none;font:700 14px system-ui,sans-serif;cursor:pointer}.share-line{background:#06c755}.share-facebook{background:#1877f2}.share-telegram{background:#2586bb}.share-copy{background:#0d2d55}.share-status{font-size:13px;color:#22673c;margin-top:9px;min-height:1.4em}.explore{display:block;text-align:center;margin-top:28px;padding:14px 18px;border:1px solid #ccd5e1;border-radius:10px;text-decoration:none;color:#0d2c52;font-weight:800;background:#f7f9fc}</style></head><body><header><div><a class="brand" href="./">FJU<span>.</span> CONNECT JAPAN</a><a href="./#fju-news">← Voltar</a></div></header><main><a class="back" href="./#fju-news">← Últimas matérias</a><article class="article" id="article"><p class="loading">Carregando matéria…</p></article></main>
<script type="module">
import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const db=createClient('https://hmacroktklgwkofxsygv.supabase.co','sb_publishable_mdkfafhpqtthwzU8Hf7u9A_rErx3MFJ');
const root=document.getElementById('article'),params=new URLSearchParams(location.search),id=params.get('id');
const returnQuery=params.get('voltar');if(returnQuery!==null&&returnQuery.startsWith('?')&&returnQuery.length<2500){const backUrl='materias.html'+returnQuery;document.querySelector('main .back').href=backUrl;document.querySelector('header a[href="./#fju-news"]').href=backUrl;}
const langs=['pt','ja','en'],names={pt:'Português',ja:'日本語',en:'English'};
const ui={pt:{available:'Idiomas disponíveis',choose:'Escolher idioma',shareTitle:'Compartilhe esta matéria',share:'Compartilhar',copied:'Link copiado! Cole no aplicativo em que deseja compartilhar.',failed:'Compartilhamento indisponível neste navegador. Copie o endereço da matéria.',back:'← Últimas matérias',return:'← Voltar',explore:'Ver todas as matérias →'},ja:{available:'対応言語',choose:'言語を選択',shareTitle:'この記事を共有',share:'共有する',copied:'リンクをコピーしました。共有したいアプリに貼り付けてください。',failed:'このブラウザーでは共有できません。記事のURLをコピーしてください。',back:'← 最新の記事',return:'← 戻る',explore:'すべての記事を見る →'},en:{available:'Available languages',choose:'Choose language',shareTitle:'Share this article',share:'Share',copied:'Link copied! Paste it into the app you want to share with.',failed:'Sharing is unavailable in this browser. Copy the article URL.',back:'← Latest articles',return:'← Back',explore:'Browse all articles →'}};
const add=(parent,tag,value,cls)=>{const e=document.createElement(tag);if(cls)e.className=cls;e.textContent=value||'';parent.appendChild(e);return e;};
function available(a){return langs.filter(l=>['titulo','texto1','texto2','final'].every(k=>a[k+'_'+l]&&a[k+'_'+l].trim()));}
async function signed(path){if(!path)return null;const{data,error}=await db.storage.from('fju-materias').createSignedUrl(path,1800);return error?null:data.signedUrl;}
function localizedDate(value,lang){if(!value)return '';const day=String(value).slice(0,10);if(!/^\d{4}-\d{2}-\d{2}$/.test(day))return day;const [y,m,d]=day.split('-').map(Number);const date=new Date(Date.UTC(y,m-1,d,12));if(date.getUTCFullYear()!==y||date.getUTCMonth()!==m-1||date.getUTCDate()!==d)return day;return new Intl.DateTimeFormat(lang==='ja'?'ja-JP':lang==='en'?'en-US':'pt-BR',{day:'numeric',month:'short',year:'numeric',timeZone:'UTC'}).format(date);}
async function show(a,lang){const u=ui[lang]||ui.pt;document.documentElement.lang=lang==='ja'?'ja':lang==='en'?'en':'pt-BR';document.querySelector('main .back').textContent=u.back;document.querySelector('header a[href^="materias.html"],header a[href="./#fju-news"]').textContent=u.return;root.replaceChildren();const cover=await signed(a.foto1);if(cover){const img=add(root,'img','');img.src=cover;img.className='cover';img.alt='Foto principal da matéria';}const content=add(root,'div','','content');add(content,'div',[(a.categoria||'FJU').replaceAll('_',' '),localizedDate(a.data_materia||a.criado_em,lang)].filter(Boolean).join(' • '),'meta');add(content,'h1',a['titulo_'+lang],'title');const options=available(a);add(content,'div',u.available+': '+options.map(x=>names[x]).join(' • '),'tag');const selector=add(content,'select','');selector.setAttribute('aria-label',u.choose);for(const l of options){const option=add(selector,'option',names[l]);option.value=l;}selector.value=lang;selector.onchange=()=>{const url=new URL(location.href);url.searchParams.set('lang',selector.value);history.replaceState(null,'',url);show(a,selector.value);};add(content,'p',a['texto1_'+lang],'bodytext');const img2=await signed(a.foto2);if(img2){const img=add(content,'img','');img.src=img2;img.className='photo';img.alt='Segunda foto da matéria';img.loading='lazy';}add(content,'p',a['texto2_'+lang],'bodytext');const img3=await signed(a.foto3);if(img3){const img=add(content,'img','');img.src=img3;img.className='photo';img.alt='Terceira foto da matéria';img.loading='lazy';}add(content,'p',a['final_'+lang],'bodytext');const share=add(content,'div','','share');add(share,'p',u.shareTitle,'share-title');const buttons=add(share,'div','','share-buttons');const button=add(buttons,'button',u.share,'share-facebook');button.type='button';button.setAttribute('aria-label',u.shareTitle);const status=add(share,'div','','share-status');status.setAttribute('role','status');button.onclick=async()=>{const preview=new URL('share/'+a.id+'.html',location.href).toString();if(typeof navigator.share==='function'){try{await navigator.share({url:preview});return;}catch(e){if(e&&e.name==='AbortError')return;}}try{await navigator.clipboard.writeText(preview);status.textContent=u.copied;}catch(e){status.textContent=u.failed;}};const explore=add(content,'a',u.explore,'explore');explore.href='materias.html?lang='+encodeURIComponent(lang);document.title=a['titulo_'+lang]+' | FJU Connect JAPAN';}
async function init(){if(!id||!/^[0-9a-f]{8}-[0-9a-f-]{27,}$/i.test(id)){root.innerHTML='<p class="loading error">Link da matéria inválido.</p>';return;}try{const{data,error}=await db.from('fju_materias').select('*').eq('id',id).eq('status','publicada').maybeSingle();if(error)throw error;if(!data){root.innerHTML='<p class="loading">Matéria não encontrada ou ainda não publicada.</p>';return;}const options=available(data);if(!options.length){root.innerHTML='<p class="loading">Nenhum idioma disponível nesta matéria.</p>';return;}const requested=params.get('lang'),browser=(navigator.language||'pt').slice(0,2);await show(data,options.includes(requested)?requested:options.includes(browser)?browser:options.includes('pt')?'pt':options[0]);}catch(e){root.replaceChildren();add(root,'p','Não foi possível carregar a matéria. Tente novamente.','loading error');console.warn(e);}}
init();
</script></body></html>
