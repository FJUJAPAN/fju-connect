<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>FJU CONNECT — Regras e Pontuação</title></head>
<body><p>Opening the FJU CONNECT rules page…</p>
