<!doctype html><html lang="pt"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cadastro de time FJU</title><style>body{background:#11101b;color:#faf7ff;font:16px system-ui;max-width:650px;margin:auto;padding:18px}section{background:#211d32;border:1px solid #44395b;border-radius:15px;padding:16px;margin:14px 0}label{display:block;margin:12px 0}input,select{width:100%;box-sizing:border-box;padding:12px;background:#100f1b;color:white;border:1px solid #554b67;border-radius:8px}.btn{width:100%;padding:14px;background:#b27aff;border:0;border-radius:10px;font-weight:bold;margin:7px 0}.hide{display:none}.notice{background:#30233f;padding:12px;border-radius:8px;word-break:break-all}</style><main><h1>Cadastro de time</h1><p>Link único compartilhado por toda a equipe.</p><div id="notice" class="notice"></div><section id="events">Campeonatos abertos…</section><section id="captain" class="hide"><h2>Dados do capitão/time</h2><p id="event"></p><form id="teamForm"><label>Nome do time<input name="team" required maxlength="80"></label><label>Capitão<input name="captain" required maxlength="100"></label><label>E-mail do capitão<input name="email" type="email" required></label><label>Nascimento<input name="birth" type="date" required></label><label>Polo<select name="polo" required></select></label><label>Cidade/bairro<input name="city" required></label><label>Foto do capitão<input name="photo" type="file" accept="image/*" required></label><label><input name="consent" type="checkbox" required> Autorizo o uso dos dados.</label><button class="btn">Cadastrar time</button></form></section><section id="share" class="hide"><h2 id="teamTitle"></h2><div id="shared" class="notice"></div><button class="btn" id="copy">Copiar link</button><button class="btn" id="shareBtn">Compartilhar</button><p id="mailStatus"></p><div id="roster"></div><button class="btn" id="join">Cadastrar atleta</button></section><section id="player" class="hide"><h2>Cadastro de atleta</h2><form id="playerForm"><label>Nome<input name="name" required></label><label>Nascimento<input name="birth" type="date" required></label><label>Cidade/bairro<input name="city" required></label><label>Foto<input name="photo" type="file" accept="image/*" required></label><label><input name="consent" type="checkbox" required> Confirmo autorização.</label><button class="btn">Enviar</button></form></section></main><script type="module">
import{createClient}from'https://esm.sh/@supabase/supabase-js@2';const db=createClient('https://hmacroktklgwkofxsygv.supabase.co','sb_publishable_mdkfafhpqtthwzU8Hf7u9A_rErx3MFJ'),$=s=>document.querySelector(s);let evs=[],ev=null,raw='',h='';const sections=['events','captain','share','player'];function show(id){sections.forEach(s=>$('#'+s).classList.toggle('hide',s!==id))}function msg(s){$('#notice').textContent=s}const token=()=>{let b=new Uint8Array(32);crypto.getRandomValues(b);return [...b].map(x=>x.toString(16).padStart(2,'0')).join('')};async function hash(s){return [...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)))].map(x=>x.toString(16).padStart(2,'0')).join('')}const today=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Tokyo'}).format(new Date());const date=s=>new Date(s+'T12:00:00+09:00').toLocaleDateString('ja-JP');async function image(file){let im=await createImageBitmap(file),scale=Math.min(1,1200/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*scale);c.height=Math.round(im.height*scale);c.getContext('2d').drawImage(im,0,0,c.width,c.height);return new Promise(r=>c.toBlob(r,'image/jpeg',.8))}async function roster(d){$('#roster').replaceChildren();for(const p of d?.jogadores||[]){let x=document.createElement('p');x.textContent=(p.nome||'')+' · '+p.status;$('#roster').append(x)}}async function teamLink(s){raw=s;h=await hash(s);let{data,error}=await db.rpc('fju_campeonato_time_por_link',{p_link_time_hash:h});if(error||!data){msg('Link inválido');show('events');return}show('share');$('#teamTitle').textContent=data.nome+' / '+data.evento;let url=location.origin+'/inscricao-time/?time='+encodeURIComponent(s);$('#shared').textContent=url;$('#copy').onclick=()=>navigator.clipboard.writeText(url).then(()=>msg('Link copiado'));$('#shareBtn').onclick=()=>navigator.share?navigator.share({url}):navigator.clipboard.writeText(url);$('#mailStatus').textContent='O link está pronto. E-mail automático precisa de configuração de envio.';$('#join').disabled=(data.jogadores||[]).length>=data.max||!data.inscricoes_abertas;$('#join').onclick=()=>show('player');roster(data)}async function init(){let{data,error}=await db.rpc('fju_campeonato_eventos_publicos');if(error)throw error;evs=(data||[]).filter(e=>e.publicado&&e.inscricoes_abertas&&(!e.prazo_inscricao||e.prazo_inscricao>=today()));let{data:p,error:pe}=await db.rpc('fju_campeonato_listar_polos');if(pe)throw pe;const q=new URLSearchParams(location.search);if(q.has('time')){await teamLink(q.get('time'));return}let req=q.get('evento');if(req)ev=evs.find(x=>String(x.id)===req);$('#events').replaceChildren();for(let e of evs){let card=document.createElement('section');card.textContent=e.titulo+' / '+e.modalidade+' / '+date(e.data_evento);let b=document.createElement('button');b.className='btn';b.textContent='Cadastrar time';b.onclick=()=>{ev=e;form()};card.append(b);$('#events').append(card)}let sel=$('#teamForm select');sel.innerHTML='<option value="">Selecione polo</option>';p.forEach(x=>sel.add(new Option(x.nome,x.id)));if(ev)form()}function form(){if(!ev)return;$('#event').textContent=ev.titulo+' · '+ev.modalidade;show('captain')}$('#teamForm').onsubmit=async e=>{e.preventDefault();let f=e.currentTarget,b=f.querySelector('button');b.disabled=true;let path=null;try{let d=new FormData(f),ct=token(),ch=await hash(ct);raw=token();h=await hash(raw);path=ch+'/foto.jpg';let blob=await image(d.get('photo'));let up=await db.storage.from('fju-campeonato-jogadores').upload(path,blob,{contentType:'image/jpeg'});if(up.error)throw up.error;let{data:teamId,error}=await db.rpc('fju_campeonato_criar_time_link',{p_campeonato_id:ev.id,p_polo_id:d.get('polo'),p_nome_time:d.get('team').trim(),p_nome_capitao:d.get('captain').trim(),p_email_capitao:d.get('email').trim(),p_nascimento_capitao:d.get('birth'),p_cidade_capitao:d.get('city').trim(),p_foto_capitao_path:path,p_link_time_hash:h,p_token_capitao_hash:ch,p_consent:d.get('consent')==='on'});if(error)throw error;await teamLink(raw);const mail=await db.functions.invoke('fju-email-link-time',{body:{team_id:teamId,team_link:location.origin+'/inscricao-time/?time='+encodeURIComponent(raw)}});$('#mailStatus').textContent=mail.error?'Link criado; envio de e-mail não confirmado. Compartilhe o link manualmente.':'Confirmação enviada para o e-mail do capitão.';history.replaceState({},'', '?time='+encodeURIComponent(raw))}catch(x){msg(x.message||'Erro no cadastro');if(path)await db.storage.from('fju-campeonato-jogadores').remove([path])}finally{b.disabled=false}};$('#playerForm').onsubmit=async e=>{e.preventDefault();let f=e.currentTarget,b=f.querySelector('button');b.disabled=true;let path=null;try{let d=new FormData(f),ph=await hash(token());path=ph+'/foto.jpg';let up=await db.storage.from('fju-campeonato-jogadores').upload(path,await image(d.get('photo')),{contentType:'image/jpeg'});if(up.error)throw up.error;let{error}=await db.rpc('fju_campeonato_cadastrar_jogador_link',{p_link_time_hash:h,p_token_jogador_hash:ph,p_nome:d.get('name').trim(),p_nascimento:d.get('birth'),p_cidade_bairro:d.get('city').trim(),p_foto_path:path,p_consent:d.get('consent')==='on'});if(error)throw error;f.innerHTML='<p>Cadastro enviado para aprovação.</p>';let{data}=await db.rpc('fju_campeonato_time_por_link',{p_link_time_hash:h});roster(data)}catch(x){msg(x.message||'Erro ao enviar');if(path)await db.storage.from('fju-campeonato-jogadores').remove([path])}finally{b.disabled=false}};init().catch(x=>msg(x.message||'Falha ao carregar'));</script></html>
